title_patterns:
  - "vp.*program\\s+management"
  - "vp.*technical\\s+program"
  - "vice\\s+president.*program\\s+management"
  - "vice\\s+president.*technical\\s+program"
  - "head\\s+of\\s+program\\s+management"
  - "head\\s+of\\s+technical\\s+program"

  - "director.*program\\s+management"
  - "director.*technical\\s+program"
  - "director.*\\btpm\\b"
  - "sr\\.?\\s*director.*program"
  - "senior\\s+director.*program"

  - "sr\\.?\\s*manager.*program\\s+management"
  - "sr\\.?\\s*manager.*technical\\s+program"
  - "senior\\s+manager.*program\\s+management"
  - "senior\\s+manager.*technical\\s+program"
  - "sr\\.?\\s*manager.*\\btpm\\b"

  # [\s,]+ after the seniority word so "Staff, Technical Program Manager"
  # (comma format used by Walmart and others) matches, not just "Staff Technical…"
  - "senior[\\s,]+technical\\s+program\\s+manager"
  - "sr\\.?[\\s,]+technical\\s+program\\s+manager"
  - "principal[\\s,]+technical\\s+program\\s+manager"
  - "staff[\\s,]+technical\\s+program\\s+manager"
  - "distinguished[\\s,]+technical\\s+program\\s+manager"
  # Seniority with a qualifier in between: "Senior Software Technical Program Manager"
  - "(senior|sr\\.?)\\s+[a-z/&]+\\s+technical\\s+program\\s+manager"
  # "TPM Manager, Infrastructure" (Anthropic) = manager of TPMs
  - "\\btpm\\s+manager\\b"
  # Cisco: "Leader, Program management", "Principal Engineering, Hardware
  # Project & Program Management", "Senior Hardware Engineering Program Manager"
  - "\\bleader\\b.*program\\s+management"
  - "principal\\b.*program\\s+management"
  - "(senior|sr\\.?|principal|staff)\\s+([a-z/&]+\\s+){0,2}engineering\\s+program\\s+manager"

  # Role families pursued in practice (fit rules: accepted disciplines).
  # Manager of TPMs/EPMs, e.g. "Manager, Technical Program Management"
  - "\\bmanager,?\\s+(of\\s+)?(technical|engineering)\\s+program"
  # Engineering program management (Apple/Adobe style EPM)
  - "director.*engineering\\s+program"
  - "head\\s+of\\s+engineering\\s+program"
  - "engineering\\s+program\\s+manager.*\\bmanager\\b"
  - "(sr\\.?|senior)\\s*manager.*engineering\\s+program"
  # Engineering operations leadership
  - "(head\\s+of|director|vp|vice\\s+president).*engineering\\s+operations"
  # AI program office / AI delivery leadership
  - "(head\\s+of|director|vp|vice\\s+president).*\\bai\\b.*(program|delivery)"

# Companies that never put seniority in titles: Anthropic ("Technical Program
# Manager, Compute"), Netflix ("Technical Program Manager 6"), Apple
# ("Engineering Program Manager"). For these a plain TPM/EPM title is kept
# (scored as standard) and the AI fit check reads the JD to judge level.
unleveled_title_companies:
  - anthropic
  - netflix
  - apple
  # Google: the adapter already restricts to ADVANCED/DIRECTOR_PLUS levels.
  - google
  # Cisco: "2025124 Technical Program Manager", level only in the JD.
  - cisco
  # AI labs and startups mostly post plain "Technical Program Manager".
  - openai
  - xai
  - perplexity
  - cursor
  - cohere
  - coreweave
  - crusoe
  - baseten
  - cerebras
  - character
  - deepgram
  - mercor
  - reflectionai
  - sesame
  - suno
  - thinkingmachines
  - physicalintelligence
  - lambda
  - togetherai
  - sambanovasystems
  - figureai
  - scaleai
unleveled_title_patterns:
  - "technical\\s+program\\s+manager"
  - "engineering\\s+program\\s+manager"
  - "\\btpm\\b"

excluded_title_patterns:
  - "intern"
  - "internship"
  - "new\\s+graduate"
  - "\\bnew\\s+grad\\b"
  - "junior"
  - "\\bjr\\.?\\b"
  - "associate"
  - "entry\\s*level"
  - "early\\s+career"
  - "level\\s*[1-3]\\b"

preferred_locations:
  - boston
  - massachusetts
  - "remote"
  - "us-remote"
  # (not "united states": every US job already gets remote_or_us, so it
  # double-counted and made Nashville "preferred")
  - "new york"
  - "ny metro"

excluded_locations:
  - "india"
  - "bengaluru"
  - "bangalore"
  - "gurugram"
  - "hyderabad"
  - "mumbai"
  - "chennai"
  - "pune"
  - "noida"
  - "philippines"
  - "manila"
  - "singapore"
  - "tokyo"
  - "japan"
  - "shanghai"
  - "beijing"
  - "china"
  - "dublin"
  - "barcelona"
  - "berlin"
  - "munich"
  - "amsterdam"
  - "warsaw"

excluded_companies: []

score_weights:
  title_match: 25

  vp_or_head: 40
  director: 35
  director_equiv: 35
  sr_manager: 30
  staff_or_principal: 25
  tpm_manager: 25
  senior_tpm: 20
  unleveled_title_bonus: 20

  remote_or_us: 20
  preferred_location_bonus: 10
  excluded_location_penalty: -60
  excluded_company_penalty: -100

seniority_keywords:
  vp_or_head:
    - "\\bvp\\b"
    - "vice\\s+president"
    - "head\\s+of"

  director:
    - "director"
    - "sr\\.?\\s*director"
    - "senior\\s+director"

  sr_manager:
    - "sr\\.?\\s*manager"
    - "senior\\s+manager"

  staff_or_principal:
    - "staff"
    - "principal"
    - "distinguished"

  tpm_manager:
    - "\\bmanager,?\\s+(of\\s+)?(technical|engineering)\\s+program"
    - "engineering\\s+program\\s+manager.*\\bmanager\\b"
    - "\\btpm\\s+manager\\b"

  senior_tpm:
    - "senior\\s+technical\\s+program\\s+manager"
    - "sr\\.?\\s+technical\\s+program\\s+manager"
    - "(senior|sr\\.?)\\s+[a-z/&]+\\s+technical\\s+program\\s+manager"
    - "(senior|sr\\.?)\\s+([a-z/&]+\\s+){0,2}engineering\\s+program\\s+manager"

  # "Leader, Program management" (Cisco's director-equivalent naming)
  director_equiv:
    - "\\bleader\\b.*program\\s+management"

notification_threshold: 60
hot_match_threshold: 80

# Drop jobs whose ATS-reported posted_at is older than this many days.
# Jobs with no posted_at (or an unparseable one) are kept — we don't know
# their age, so we don't penalize missing data.
max_posted_age_days: 14
