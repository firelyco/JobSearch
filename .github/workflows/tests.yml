name: Tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/app.js"
      - "docs/index.html"
      - "tests/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check dashboard and history behavior
        run: |
          node --check docs/app.js
          node tests/test_evidence_dashboard.cjs
          node tests/test_remote_dashboard.cjs
          node tests/test_cloud_history.cjs
          node tests/test_shortlist_validation.cjs
