name: Poll job boards

on:
  schedule:
    # Off the :00/:15 marks: GitHub delays or drops scheduled runs at peak
    # minutes, and in practice this fired only ~4-8 times a day at */15.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "config/**"
      - "src/**"
      - ".github/workflows/poll.yml"

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Latest main, not the triggering commit: a queued run would
          # otherwise start from a stale tree and conflict on push.
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run poller
        run: python -m src.poll

      - name: Commit updated jobs and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/jobs.json docs/meta.json state/seen_jobs.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "poll: refresh jobs $(date -u +%Y-%m-%dT%H:%MZ)"
            # fit/tailor runs may have pushed since checkout; fold them in.
            # If another poll's output landed first, this run's files are
            # newer: keep them whole (during a rebase, "theirs" is our commit)
            # rather than hunk-merging JSON.
            OUTPUTS="docs/jobs.json docs/meta.json state/seen_jobs.json"
            if ! git pull --rebase origin main; then
              git checkout --theirs -- $OUTPUTS
              git add $OUTPUTS
              GIT_EDITOR=true git rebase --continue
            fi
            git push
          fi
