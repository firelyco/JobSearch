name: Poll job boards

on:
  schedule:
    # Once daily at 6 AM New York local time, including daylight-saving changes.
    - cron: "0 6 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      daily_only:
        description: "Skip when today's job refresh is already published"
        type: boolean
        default: false

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOBSEARCH_METRICS: '1'
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
      YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
      HISTORY_SCORER_TOKEN: ${{ secrets.HISTORY_SCORER_TOKEN }}
      JOBSEARCH_ALERT_MAILBOX: ${{ vars.JOBSEARCH_ALERT_MAILBOX || 'INBOX' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Latest main, not the triggering commit: a queued run would
          # otherwise start from a stale tree and conflict on push.
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Skip duplicate scheduled daily refresh
        id: daily
        env:
          DAILY_ONLY: ${{ inputs.daily_only && 'true' || 'false' }}
        run: python -m src.daily_refresh --gate

      - name: Install dependencies
        if: steps.daily.outputs.run == 'true' 
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run poller
        if: steps.daily.outputs.run == 'true'
        run: python -m src.poll

      - name: Commit updated jobs and state
        if: steps.daily.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node src/validate_shortlist.cjs --report=docs/shortlist_validation_poll.json
          git add docs/shortlist_validation_poll.json
          git add docs/metrics
          git add docs/email_alerts.json docs/coverage_audit.json docs/jobs.json docs/meta.json state/seen_jobs.json state/discovery_cache.json state/discovered_boards.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "poll: refresh jobs $(date -u +%Y-%m-%dT%H:%MZ)"
            # fit/tailor runs may have pushed since checkout; fold them in.
            # If another poll's output landed first, this run's files are
            # newer: keep them whole (during a rebase, "theirs" is our commit)
            # rather than hunk-merging JSON.
            OUTPUTS="docs/email_alerts.json docs/coverage_audit.json docs/shortlist_validation_poll.json docs/jobs.json docs/meta.json state/seen_jobs.json state/discovery_cache.json state/discovered_boards.json"
            if ! git pull --rebase origin main; then
              git checkout --theirs -- $OUTPUTS
              git add $OUTPUTS
              GIT_EDITOR=true git rebase --continue
            fi
            node src/validate_shortlist.cjs --check-only
            git push
          fi
