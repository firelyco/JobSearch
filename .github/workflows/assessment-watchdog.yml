name: Resume unfinished assessments

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

concurrency:
  group: assessment-watchdog
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restart only unfinished assessments
        env:
          GH_TOKEN: ${{ github.token }}
          FIT_RESUME_PIPELINE: ${{ vars.JOBSEARCH_RESUME_PIPELINE || 'false' }}
        run: python -m src.assessment_watchdog
