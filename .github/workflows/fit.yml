name: Score profile fit

on:
  workflow_run:
    workflows: ["Poll job boards"]
    types: [completed]
  workflow_dispatch:
    inputs:
      resume_pipeline:
        description: "Validate resumable assessment execution"
        type: boolean
        default: false
      backfill:
        description: "Continue the saved seven-day backfill"
        type: boolean
        default: false
      provider:
        description: "Optional provider override for validation"
        type: choice
        options: [default, nvidia, anthropic]
        default: default
      validate_only:
        description: "Assess selected jobs without publishing dashboard changes"
        type: boolean
        default: false
      provider_health:
        description: "Check API availability without sending career evidence"
        type: boolean
        default: false
      publish_benchmark:
        description: "Publish a fully passing current calibration without repeating model calls"
        type: boolean
        default: false
      benchmark_review:
        description: "Independently re-review saved extraction evidence"
        type: boolean
        default: false
      benchmark_replay:
        description: "Replay saved evidence audits before making new model calls"
        type: boolean
        default: false
      benchmark:
        description: "Run reviewed real-posting calibration without changing ratings"
        type: boolean
        default: false
      inventory_only:
        description: "Build private evidence inventory without changing scores"
        type: boolean
        default: false
      job_keys:
        description: "Optional JSON array of job keys to refresh"
        required: false
        type: string
      rescore:
        description: "Re-score every job, ignoring the cache"
        required: false
        type: boolean
        default: false
      max:
        description: "Max jobs to score this run (default 6)"
        required: false
        type: string
        default: "6"

# Serialize fit runs; never run two at once (they both write fit_scores.json).
concurrency:
  group: ${{ inputs.provider_health && 'fit-provider-health' || inputs.validate_only && 'fit-validation' || inputs.benchmark && 'fit-benchmark' || 'fit' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.benchmark && 45 || 30 }}
    # On the workflow_run trigger, only proceed if the poll actually succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      FIT_RESUME_PIPELINE: ${{ inputs.resume_pipeline && 'true' || vars.JOBSEARCH_RESUME_PIPELINE || 'false' }}
      NVIDIA_FIT_JSON_SCHEMA: ${{ vars.JOBSEARCH_NVIDIA_JSON_SCHEMA || 'false' }}
      HISTORY_SCORER_TOKEN: ${{ secrets.HISTORY_SCORER_TOKEN }}
      LLM_PROVIDER: ${{ (inputs.provider != 'default' && inputs.provider) || vars.JOBSEARCH_LLM_PROVIDER || 'anthropic' }}
      NVIDIA_MODEL: ${{ vars.JOBSEARCH_NVIDIA_MODEL || 'nvidia/nemotron-3-super-120b-a12b' }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Latest main, not the triggering commit, so a queued run doesn't
          # start from a stale state file.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify model API key is set
        run: |
          if [ "$LLM_PROVIDER" = "nvidia" ]; then
            if [ -z "$NVIDIA_API_KEY" ]; then
              echo "::error::NVIDIA_API_KEY secret is not configured (LLM_PROVIDER=nvidia)"
              exit 1
            fi
          else
            if [ -z "$ANTHROPIC_API_KEY" ]; then
              echo "::error::ANTHROPIC_API_KEY secret is not configured"
              exit 1
            fi
          fi

      - name: Require approval for private evidence transfer to NVIDIA
        if: env.LLM_PROVIDER == 'nvidia' && vars.JOBSEARCH_NVIDIA_DATA_APPROVED != 'true' && inputs.provider_health != true
        run: |
          echo "::error::NVIDIA connectivity is available, but private career-data transfer awaits explicit approval."
          exit 1

      - name: Require NVIDIA assessment validation before production
        if: env.LLM_PROVIDER == 'nvidia' && vars.JOBSEARCH_NVIDIA_VALIDATED != 'true' && inputs.provider_health != true && inputs.validate_only != true
        run: |
          echo "::error::NVIDIA production processing is waiting for the reviewed sample validation to pass."
          exit 1

      - name: Write profile.json from secret
        run: |
          if [ -z "$PROFILE_JSON" ]; then
            echo "::error::PROFILE_JSON secret is not configured."
            exit 1
          fi
          mkdir -p config
          printf '%s' "$PROFILE_JSON" > config/profile.json
          python -c "import json; json.load(open('config/profile.json'))" \
            || (echo "::error::PROFILE_JSON secret is not valid JSON"; exit 1)
        env:
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}

      - name: Write fit_rules.json from secret
        # Personal screening rules stay out of the public repo. Optional:
        # without the secret, fit.py uses the generic method only.
        run: |
          if [ -n "$FIT_RULES_JSON" ]; then
            printf '%s' "$FIT_RULES_JSON" > config/fit_rules.json
            python -c "import json; json.load(open('config/fit_rules.json'))"               || (echo "::error::FIT_RULES_JSON secret is not valid JSON"; exit 1)
          fi
        env:
          FIT_RULES_JSON: ${{ secrets.FIT_RULES_JSON }}

      - name: Load required private fitment skill
        env:
          FITMENT_SKILL_TEXT: ${{ secrets.JOBSEARCH_FITMENT_SKILL }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from src.fitment_skill import load_text
          text = load_text()
          Path('config/fitment_skill.md').write_text(text, encoding='utf-8')
          print('Private three-verdict fitment skill loaded.')
          PY

      - name: Configure NVIDIA assessment models
        if: env.LLM_PROVIDER == 'nvidia'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import yaml
          model = os.environ['NVIDIA_MODEL']
          path = Path('config/tailor_config.yml')
          config = yaml.safe_load(path.read_text())
          config['models']['fit'] = model
          path.write_text(yaml.safe_dump(config))
          path = Path('config/fit_rules.json')
          rules = json.loads(path.read_text()) if path.exists() else {}
          rules['evidence_review_model'] = model
          rules.pop('fit_api_blocked', None)
          path.write_text(json.dumps(rules))
          print('Assessment extraction and review provider: NVIDIA; model:', model)
          PY

      - name: Check provider before scoring
        id: provider_check
        if: inputs.provider_health != true && inputs.inventory_only != true && inputs.publish_benchmark != true
        run: python -m src.fit_provider_health

      - name: Record provider interruption
        if: failure() && steps.provider_check.outcome == 'failure' && inputs.validate_only != true
        run: python -m src.fit_backfill --provider-error

      - name: Score fit for new jobs
        env:
          FIT_BACKFILL: ${{ inputs.backfill }}
          FIT_EXPLICIT_JOB_KEYS: ${{ inputs.job_keys }}
          FIT_VALIDATE_ONLY: ${{ inputs.validate_only }}
          FIT_PROVIDER_HEALTH: ${{ inputs.provider_health }}
          FIT_PUBLISH_BENCHMARK: ${{ inputs.publish_benchmark }}
          FIT_JOB_KEYS: ${{ inputs.job_keys || vars.JOBSEARCH_PRIORITY_JOB_KEYS }}
          FIT_INVENTORY_ONLY: ${{ inputs.inventory_only }}
          FIT_BENCHMARK: ${{ inputs.benchmark }}
          FIT_BENCHMARK_REPLAY: ${{ inputs.benchmark_replay }}
          FIT_BENCHMARK_REVIEW: ${{ inputs.benchmark_review }}
        run: |
          if [ "$FIT_PROVIDER_HEALTH" = "true" ]; then
            if [ "$FIT_RESUME_PIPELINE" = "true" ]; then
              python -m src.fit_provider_health --schema-probe
            else
              python -m src.fit_provider_health
            fi
            exit $?
          fi
          if [ "$FIT_PUBLISH_BENCHMARK" = "true" ]; then
            python -m src.promote_fit_benchmark
            exit $?
          fi
          if [ "$FIT_BENCHMARK" = "true" ]; then
            python -m src.fit_benchmark
            exit $?
          fi
          if [ "$FIT_INVENTORY_ONLY" = "true" ]; then
            python -m src.fit --inventory-only
            exit 0
          fi
          if [ "$FIT_BACKFILL" = "true" ] || ( [ "$FIT_VALIDATE_ONLY" != "true" ] && [ -z "$FIT_EXPLICIT_JOB_KEYS" ] && python -m src.fit_backfill --should-continue ); then
            FIT_BACKFILL_PUBLISH=true python -m src.fit_backfill --max "${{ inputs.max || '6' }}"
            exit $?
          fi
          ARGS="--max ${{ inputs.max || '6' }}"
          if [ "${{ inputs.rescore }}" = "true" ]; then
            ARGS="$ARGS --rescore"
          fi
          if [ -n "$FIT_JOB_KEYS" ]; then
            python -m src.fit $ARGS --job-keys "$FIT_JOB_KEYS"
          else
            python -m src.fit $ARGS
          fi

      - name: Verify selected assessment results
        if: inputs.validate_only == true && inputs.provider_health != true
        env:
          FIT_JOB_KEYS: ${{ inputs.job_keys }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          keys = json.loads(os.environ.get('FIT_JOB_KEYS') or '[]')
          assert keys, 'Validation requires explicit job keys'
          scores = json.loads(Path('docs/fit_scores.json').read_text())
          for key in keys:
              score = scores.get(key, {})
              age = (datetime.now(timezone.utc) - datetime.fromisoformat(score.get('scored_at', '1970-01-01T00:00:00+00:00'))).total_seconds()
              assert age < 1800 and score.get('recommendation') in ('strong','medium','not'), 'No completed assessment for ' + key
              print(key, score['recommendation'])
          benchmark = json.loads(Path('config/fit_benchmark.json').read_text())
          for case in benchmark.get('cases', []):
              if case['job_key'] in keys:
                  score = scores[case['job_key']]
                  actual = score.get('career_fit', score['recommendation'])
                  assert actual in case['allowed_career_fit'], 'Calibration mismatch: ' + case['job_key'] + ' => ' + actual
          PY

      - name: Commit updated fit_scores.json
        # Run even if scoring died part-way: fit.py saves after each verdict,
        # so whatever finished is still worth committing.
        if: always() && inputs.validate_only != true && inputs.provider_health != true
        run: |
          # Runtime model overrides must not be committed or block the rebase.
          git restore -- config/tailor_config.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/fit_scores.json
          if [ -f docs/fit_backfill.json ]; then git add docs/fit_backfill.json; fi
          if [ -f docs/fit_benchmark.json ]; then git add docs/fit_benchmark.json; fi
          if [ -f docs/fit_policy.json ]; then git add docs/fit_policy.json; fi
          if git diff --staged --quiet; then
            echo "no fit-score changes to commit"
          else
            # commit BEFORE rebasing — git refuses to rebase with a dirty index
            git commit -m "fit: score profile fit $(date -u +%Y-%m-%dT%H:%MZ)"
            # Another run may have pushed docs/fit_scores.json meanwhile; on conflict, union
            # the two versions by key (ours wins) instead of failing.
            cp docs/fit_scores.json "$RUNNER_TEMP/ours.json"
            if ! git pull --rebase origin main; then
              git checkout --ours -- docs/fit_scores.json   # during a rebase, "ours" is upstream main
              python -m src.merge_json docs/fit_scores.json "$RUNNER_TEMP/ours.json"
              git add docs/fit_scores.json
          if [ -f docs/fit_policy.json ]; then git add docs/fit_policy.json; fi
              GIT_EDITOR=true git rebase --continue
            fi
            git push
          fi

      - name: Continue seven-day backfill
        if: success() && inputs.validate_only != true && inputs.provider_health != true && inputs.benchmark != true && inputs.inventory_only != true && inputs.publish_benchmark != true && inputs.job_keys == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -m src.fit_backfill --should-continue; then
            gh workflow run fit.yml --repo "$GITHUB_REPOSITORY" --ref main -f backfill=true -f max=6
          fi
